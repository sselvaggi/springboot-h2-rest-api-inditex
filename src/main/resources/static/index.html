<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
</head>

<body>
<div id="root"></div>
</body>
<script>
    function queryTariff(datetime, brandId = 1, productId = 35455) {
        fetch('/api/tariff/search', {
            method: "POST",
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({brandId, productId, datetime})
        })
            .then(res => res.json())
            .catch(error => console.error("Error fetching tariff:", error));
    }

    queryTariff("2020-06-14-10.00.00");
    queryTariff("2020-06-14-16.00.00");
    queryTariff("2020-06-14-21.00.00");
    queryTariff("2020-06-15-10.00.00");
    queryTariff("2020-06-16-21.00.00");
</script>

</html>
